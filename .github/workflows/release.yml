name: Release

on:
    push:
        tags:
            - '[0-9]+.[0-9]+.[0-9]+' # obsidian friendly numbering

jobs:
    release:
        name: Create Release
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build plugin
              run: npm run build

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  name: ${{ github.ref_name}}
                  tag_name: ${{ github.ref_name }}

                  files: |
                      dist/main.js
                      dist/manifest.json
                      dist/styles.css
                  draft: false
                  prerelease: false
                  generate_release_notes: true
